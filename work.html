<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<script>
  // Apply saved theme immediately before render to prevent flash
  (function(){
    var t = localStorage.getItem('hj-theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>H_Jeong® | Work</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#ffffff;--fg:#000000}[data-theme="dark"]{--bg:#000000;--fg:#ffffff}
    *{box-sizing:border-box}body{margin:0;padding:0;background-color:var(--bg);color:var(--fg);transition:background-color 0.5s,color 0.5s;-webkit-font-smoothing:antialiased;overflow-x:hidden}::-webkit-scrollbar{display:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.animate-fadeIn{animation:fadeIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards}
    .nav-link{position:relative}.nav-link::after{content:'';position:absolute;width:0;height:2px;bottom:-4px;left:0;background-color:currentColor;transition:width 0.3s ease}.nav-link:hover::after{width:100%}.nav-link.active::after{width:100%}
    #mobile-menu{transition:transform 0.5s cubic-bezier(0.16,1,0.3,1),opacity 0.5s}#mobile-menu.open{transform:translateY(0);opacity:1;pointer-events:all}#mobile-menu.closed{transform:translateY(-100%);opacity:0;pointer-events:none}
    [data-theme="light"] header{background:rgba(255,255,255,0.9);border-bottom:2px solid black}[data-theme="dark"] header{background:rgba(0,0,0,0.8);border-bottom:1px solid rgba(255,255,255,0.1)}
    [data-theme="light"] #mobile-menu{background:white}[data-theme="dark"] #mobile-menu{background:black}
    [data-theme="light"] #theme-toggle{background:white;border:2px solid black;color:black}[data-theme="light"] #theme-toggle:hover{box-shadow:4px 4px 0px 0px black}
    [data-theme="dark"] #theme-toggle{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;border-radius:9999px}

    /* Masonry columns */
    .masonry{columns:1;gap:2.5rem}
    @media(min-width:768px){.masonry{columns:2;gap:2.5rem}}
    @media(min-width:1024px){.masonry{columns:3;gap:2.5rem}}
    .masonry-item{break-inside:avoid;overflow:hidden;margin-bottom:2.5rem;transition:all 0.7s ease}
    .masonry-item img{width:100%;height:auto;display:block}
    [data-theme="light"] .masonry-item{border:2px solid black}
    [data-theme="light"] .masonry-item:hover{box-shadow:12px 12px 0px 0px rgba(0,0,0,1)}
    [data-theme="light"] .masonry-item img{filter:none;transition:filter 0.5s ease}
    [data-theme="light"] .masonry-item:hover img{filter:grayscale(0)}
    [data-theme="dark"] .masonry-item{border-radius:2.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.8);background:#18181b}
    [data-theme="dark"] .masonry-item:hover{transform:scale(1.03)}
  </style>
</head>
<body class="light-mode">

<header class="fixed top-0 left-0 w-full z-[210] backdrop-blur-md" style="transition:background 0.5s,border 0.5s;">

    <a href="index.html" id="logo" class="text-2xl font-bold tracking-tighter" style="text-decoration:none;color:inherit;font-family:'Playfair Display',serif;">H_Jeong®</a>
    <nav class="hidden lg:flex items-center space-x-6">
      <a href="index.html"        class="nav-link text-[13px] tracking-widest px-2 whitespace-nowrap" style="text-decoration:none;color:inherit;">GRAPHIC</a>
      <a href="motion.html"       class="nav-link text-[13px] tracking-widest px-2 whitespace-nowrap" style="text-decoration:none;color:inherit;">MOTION</a>
      <a href="work.html" class="nav-link active text-[13px] tracking-widest px-2 whitespace-nowrap" style="text-decoration:none;color:inherit;">WORK</a>
     
      <a href="about.html"        class="nav-link text-[13px] tracking-widest px-2 whitespace-nowrap" style="text-decoration:none;color:inherit;">ABOUT</a>
    </nav>
    <button id="menu-btn" class="lg:hidden p-2" style="background:none;border:none;cursor:pointer;color:inherit;">
      <svg id="icon-open" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      <svg id="icon-close" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</header>

<div id="mobile-menu" class="fixed inset-0 z-[200] lg:hidden closed">
  <nav class="flex flex-col items-center justify-center h-full space-y-4 px-10 pt-16">
    <a href="index.html"        class="mobile-link text-[22px] tracking-tighter text-center w-full pb-3 border-b" style="text-decoration:none;color:inherit;">GRAPHIC</a>
    <a href="motion.html"       class="mobile-link text-[22px] tracking-tighter text-center w-full pb-3 border-b" style="text-decoration:none;color:inherit;">MOTION</a>
    <a href="work.html" class="mobile-link active text-[22px] tracking-tighter text-center w-full pb-3 border-b" style="text-decoration:none;color:inherit;">WORK</a>

    <a href="about.html"        class="mobile-link text-[22px] tracking-tighter text-center w-full pb-3 border-b" style="text-decoration:none;color:inherit;">ABOUT</a>
  </nav>
</div>

<button id="theme-toggle" class="fixed bottom-10 right-10 z-[200] flex items-center justify-center transition-all duration-500 shadow-2xl" style="width:3.5rem;height:3.5rem;cursor:pointer;">
  <svg id="icon-moon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
  <svg id="icon-sun"  width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

       <div class="masonry-item"><img src="./img/I/10.png"  alt="illus 10" /></div>
     <div class="masonry-item"><img src="./img/I/11.jpg"  alt="illus 11" /></div>
     <div class="masonry-item"><img src="./img/I/12.jpg"  alt="illus 12" /></div>
         <div class="masonry-item"><img src="./img/I/13.jpg"  alt="illus 13" /></div>
      <div class="masonry-item"><img src="./img/I/14.jpg"  alt="illus 14" /></div>

  </div7
</main>

<script>
const html=document.documentElement;let theme=localStorage.getItem('hj-theme')||'light';
function setTheme(t){theme=t;localStorage.setItem('hj-theme',t);html.setAttribute('data-theme',t);document.getElementById('icon-moon').style.display=t==='light'?'block':'none';document.getElementById('icon-sun').style.display=t==='dark'?'block':'none';const logo=document.getElementById('logo');logo.style.fontFamily=t==='light'?"'Playfair Display',serif":"'Inter',sans-serif";logo.style.textTransform=t==='dark'?'uppercase':'none';const h1=document.getElementById('hero-h1');h1.style.fontFamily=t==='light'?"'Playfair Display',serif":"'Inter',sans-serif";h1.style.fontStyle=t==='light'?'italic':'normal';h1.style.fontWeight=t==='dark'?'900':'300';document.querySelectorAll('.mobile-link').forEach(l=>{l.style.borderColor=t==='light'?(l.classList.contains('active')?'black':'rgba(0,0,0,0.2)'):(l.classList.contains('active')?'white':'rgba(255,255,255,0.2)');l.style.fontFamily=t==='light'?"'Playfair Display',serif":"'Inter',sans-serif";l.style.fontStyle=t==='light'?'italic':'normal';l.style.fontWeight=t==='dark'?'900':'normal';});}
document.getElementById('theme-toggle').addEventListener('click',()=>setTheme(theme==='light'?'dark':'light'));setTheme(theme);
const menuBtn=document.getElementById('menu-btn'),mobileMenu=document.getElementById('mobile-menu'),iconOpen=document.getElementById('icon-open'),iconClose=document.getElementById('icon-close');let menuOpen=false;
menuBtn.addEventListener('click',()=>{menuOpen=!menuOpen;mobileMenu.classList.toggle('open',menuOpen);mobileMenu.classList.toggle('closed',!menuOpen);iconOpen.style.display=menuOpen?'none':'block';iconClose.style.display=menuOpen?'block':'none';});
</script>
</body>
</html>
